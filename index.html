<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUXHAX KEY CENTER</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #050811;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background-image: 
        linear-gradient(rgba(5, 8, 17, 0.9), rgba(5, 8, 17, 0.9)),
        radial-gradient(circle at 50% 10%, rgba(0, 150, 255, 0.1), transparent 40%);
}

.header {
    text-align: center;
    margin-top: 20px;
    margin-bottom: 30px;
}

.logo-icon {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #00f0ff, #7000ff);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    margin: 0 auto 10px auto;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
}

.header h1 {
    font-size: 26px;
    letter-spacing: 3px;
    background: linear-gradient(90deg, #ffffff, #00f0ff, #b088ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
}

.header p {
    font-size: 11px;
    letter-spacing: 4px;
    color: #6c8ba4;
    margin-top: 5px;
    text-transform: uppercase;
}

.card {
    background: linear-gradient(180deg, rgba(12, 20, 36, 0.8) 0%, rgba(7, 11, 20, 0.9) 100%);
    border: 2px solid;
    border-image: linear-gradient(to bottom, #00f0ff, #7000ff) 1;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
    position: relative;
    margin-bottom: 25px;
}

.card h2 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 5px;
}

.card h2 span {
    background: linear-gradient(90deg, #00f0ff, #b088ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.sub-title {
    font-size: 12px;
    color: #8aa4c0;
    letter-spacing: 2px;
    margin-bottom: 25px;
    text-transform: uppercase;
}

.key-box {
    background: #080d1a;
    border: 2px solid #00f0ff;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    margin-bottom: 15px;
    word-break: break-all;
}

#key {
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 1px;
}

.copy-icon {
    color: #00f0ff;
    font-size: 20px;
    cursor: pointer;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 165, 0, 0.1);
    border: 1px solid #ffa500;
    color: #ffa500;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 25px;
    box-shadow: 0 0 10px rgba(255, 165, 0, 0.2);
}

.btn-main {
    background: linear-gradient(90deg, #00c6ff, #7000ff);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(112, 0, 255, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.btn-main:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 25px rgba(0, 240, 255, 0.6);
}

.timer-container {
    position: relative;
    width: 90px;
    height: 90px;
    margin: 0 auto 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.timer-circle {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top: 3px solid #ff3366;
    border-radius: 50%;
    animation: spin 2s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

#timer-text {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
}

.timer-sub {
    font-size: 12px;
    color: #ff6b8b;
}

.features {
    background: rgba(10, 16, 30, 0.9);
    border: 1px solid #1a2942;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    padding: 20px 10px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}

.feature-item {
    text-align: center;
    flex: 1;
    border-right: 1px solid #1a2942;
}

.feature-item:last-child {
    border-right: none;
}

.feature-item i {
    font-size: 18px;
    color: #00f0ff;
    margin-bottom: 6px;
    display: block;
}

.feature-item span {
    font-size: 10px;
    color: #8aa4c0;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: block;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo-icon"></div>
    <h1>FLUXHAX</h1>
    <p>Key Center</p>
</div>

<div class="card">
    <h2>YOUR <span>ACCESS KEY</span></h2>
    <div class="sub-title">CODM • Free Access</div>

    <div class="key-box">
        <span id="key">Generating key...</span>
        <span class="copy-icon" onclick="copyKey()">📋</span>
    </div>

    <div class="badge">
        ⏱️ VALID FOR 3 HOURS
    </div>

    <button class="btn-main" onclick="copyKey()" id="copyBtn">
        📋 Copy Access Key
    </button>

    <div class="timer-container">
        <div class="timer-circle"></div>
        <div id="timer-text">20s</div>
    </div>
    <div class="timer-sub" id="timer">Returning to home in 20s</div>
</div>

<div class="features">
    <div class="feature-item">
        <i>⏰</i>
        <span>3-Hour Access</span>
    </div>
    <div class="feature-item">
        <i>📅</i>
        <span>Daily Limit</span>
    </div>
    <div class="feature-item">
        <i>🛡️</i>
        <span>Anti-VPN</span>
    </div>
</div>

<script>
function getDeviceID() {
    let deviceId = localStorage.getItem("kaze_device_id");
    if (!deviceId) {
        deviceId = 'dev_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
        localStorage.setItem("kaze_device_id", deviceId);
    }
    return deviceId;
}

async function loadKey() {
    try {
        document.getElementById("key").innerText = "Generating...";
        let deviceId = getDeviceID();
        
        let tokenRes = await fetch(`https://server-oty8.onrender.com/token?device_id=${deviceId}`, {cache: "no-store"});
        let tokenData = await tokenRes.json();

        if (tokenData.status === "cooldown") {
            document.getElementById("key").innerText = "COOLDOWN ACTIVE";
            document.getElementById("timer-text").innerText = "⏳";
            document.getElementById("timer").innerText = tokenData.message;
            document.getElementById("copyBtn").style.display = "none";
            
            let seconds = 5;
            let interval = setInterval(() => {
                seconds--;
                if (seconds <= 0) {
                    clearInterval(interval);
                    location.replace("https://fluxhaxfreekey.onrender.com");
                }
            }, 1000);
            return;
        }

        if (!tokenData.token) {
            document.getElementById("key").innerText = "Server Error";
            return;
        }

        let token = tokenData.token;
        let keyRes = await fetch(`https://server-oty8.onrender.com/getkey?token=${token}`, {cache: "no-store"});
        let data = await keyRes.json();

        if (data.status !== "success") {
            document.getElementById("key").innerText = "Generation Failed";
            return;
        }

        let key = data.key;
        document.getElementById("key").innerText = key;
        navigator.clipboard.writeText(key).catch(() => {});
        startRedirectTimer();

    } catch (e) {
        document.getElementById("key").innerText = "Error occurred";
        console.error(e);
    }
}

function startRedirectTimer() {
    let seconds = 20;
    let timerEl = document.getElementById("timer");
    let timerText = document.getElementById("timer-text");

    timerText.innerText = seconds + "s";
    timerEl.innerText = `Returning to home in ${seconds}s`;

    let interval = setInterval(() => {
        seconds--;
        timerText.innerText = seconds + "s";
        timerEl.innerText = `Returning to home in ${seconds}s`;

        if (seconds <= 0) {
            clearInterval(interval);
            location.replace("https://fluxhaxfreekey.onrender.com");
        }
    }, 1000);
}

function copyKey() {
    let key = document.getElementById("key").innerText;
    if (key && !key.includes("Generating") && !key.includes("COOLDOWN")) {
        navigator.clipboard.writeText(key);
        alert("Key copied successfully!");
    }
}

window.onload = loadKey;
</script>

</body>
</html>
